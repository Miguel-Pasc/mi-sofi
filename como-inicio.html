<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sofi ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            /* Fondo negro para que el video resalte */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .video-container {
            width: 90%;
            /* Deja un pequeño margen a los lados */
            max-width: 400px;
            /* Tamaño máximo para que no se vea gigante en tablets */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            /* Brillo rosa sutil */
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .mensaje {
            color: white;
            text-align: center;
            margin-top: 20px;
            padding: 0 20px;
        }


        .boton-play {
            display: none;
            /* Empieza oculto */
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            /* width: 80px;
            height: 80px; */
            background-color: #ff4d6d;
            /* Un rosa/rojo vibrante */
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            animation: aparecer 0.8s ease-out, pulsar 1.5s infinite;
            z-index: 10;
        }

        .icon-play {
            margin-left: 5px;
            /* Ajuste visual para centrar el triángulo */
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes pulsar {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 77, 109, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 77, 109, 0);
            }
        }
    </style>
</head>

<body>

    <div class="mensaje">
        <h2>Nuestra historia corazón</h2>
    </div>

    <div class="video-container">
        <video id="video" controls autoplay playsinline>
            <source src="polos-opuestos.mp4" type="video/mp4">
        </video>
    </div>

    <button id="btn-iniciar" class="boton-play" onclick="alert('Gracias por permitirme estar contigo amor, que tengas un hermoso día, te amo mucho, besitos.')">
        <span class="icon-play">¡Feliz día mi amor!</span>
    </button>    

    <script>
        const miVideo = document.querySelector('video');
        const miBoton = document.getElementById('btn-iniciar');
        
        miVideo.ontimeupdate = function () {
            if (miVideo.currentTime >= 59) { // Cambia 30 por el segundo que quieras
                miVideo.pause();
                miBoton.style.display = 'block';
                miVideo.currentTime = 0; // Opcional: reinicia al principio
            }
        };

    </script>

</body>

</html>
