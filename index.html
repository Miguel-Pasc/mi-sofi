<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Ti ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fondo negro para que el video resalte */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .video-container {
            width: 90%; /* Deja un pequeño margen a los lados */
            max-width: 400px; /* Tamaño máximo para que no se vea gigante en tablets */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4); /* Brillo rosa sutil */
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .mensaje {
            color: white;
            text-align: center;
            margin-top: 20px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video controls autoplay muted playsinline loop>
            <source src="tu-video.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
    </div>

    <div class="mensaje">
        <h2>Un pequeño detalle para ti...</h2>
        <p>Espero que te guste tanto como a mí me gustas tú.</p>
    </div>

</body>
</html>
