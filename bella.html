<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rosa Encantada</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a0a1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Georgia', serif;
            color: white;
        }

        .fanal {
            position: relative;
            width: 250px;
            height: 380px;
            display: flex;
            justify-content: center;
        }

        /* La Cúpula de Cristal */
        .cupula {
            position: absolute;
            width: 200px;
            height: 320px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px 100px 0 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 50%);
            /* backdrop-filter: blur(2px); */
            z-index: 10;
        }

        /* Contenedor de la Imagen con Animación de Flotado */
        .rosa-flotante {
            position: absolute;
            bottom: 60px;
            width: 150px;
            /* Ajusta según el tamaño de tu imagen */
            z-index: 5;
            animation: levitacion 3s ease-in-out infinite;
        }

        .rosa-flotante img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.5));
        }

        @keyframes levitacion {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(2deg);
            }
        }

        /* Base de Madera */
        .base {
            position: absolute;
            bottom: 30px;
            width: 240px;
            height: 30px;
            background: #3d2616;
            border-radius: 15px;
            z-index: 11;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .mensaje {
            text-align: center;
            margin-top: 30px;
            animation: aparecer 2s ease-in forwards;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        .boton-continuar {
            display: none;
            /* Se oculta al principio */
            margin-top: 20px;
            padding: 12px 25px;
            background-color: transparent;
            border: 2px solid #ff0055;
            color: white;
            border-radius: 25px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            animation: aparecer 1s ease-in;
        }

        .boton-continuar:hover {
            background-color: #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }


        #contenedor-frases {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Para que no estorben si haces clic */
            z-index: 20;
            /* Por encima de la rosa */
        }

        .frase-cayendo {
            /* position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Georgia', serif;
            font-size: 14px;
            font-style: italic;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
            user-select: none;
            animation: caer linear forwards; */

            position: absolute;
            color: white;
            font-family: 'Georgia', serif;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            /* Efecto de estela: sombras sucesivas hacia arriba */
            text-shadow:
                0 -5px 10px rgba(255, 0, 85, 0.8),
                0 -15px 20px rgba(255, 0, 85, 0.4),
                0 -30px 40px rgba(255, 0, 85, 0.1);
            user-select: none;
            text-orientation: upright;
            animation: caer linear forwards;
        }

        @keyframes caer {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>


    <div id="contenedor-frases"></div>


    <audio id="musica-fondo" autoplay>
        <source src="bella.mp3" type="audio/mp3">
        Tu navegador no soporta audio.
    </audio>

    <button id="btn-continuar" class="boton-continuar" onclick="window.location.href='como-inicio.html'">
        Continuar
    </button>

    <div class="fanal">
        <div class="cupula"></div>

        <div class="rosa-flotante">
            <img src="rosa2.png" alt="Rosa Encantada">
        </div>

        <div class="base"></div>
    </div>

    <div class="mensaje">
        <h2>Mi amor por ti es eterno...</h2>
        <p>Feliz San Valentín, mi Bella. ❤️</p>
    </div>

    <script>
        const musica = document.getElementById('musica-fondo');
        const boton = document.getElementById('btn-continuar');

        // Intentar reproducir automáticamente (algunos navegadores lo permiten si hubo interacción previa)
        window.addEventListener('load', () => {
            musica.play().catch(error => {
                console.log("El navegador bloqueó el autoplay. Se requiere interacción.");
            });
        });

        // Mostrar botón cuando la música termine
        // musica.onended = function () {
        //     boton.style.display = 'block';
        // };


        const frases = [
            "Eres mi persona favorita",
            "Te amo más que ayer",
            "Eres mi cuento de hadas",
            "Siempre juntos",
            "Mi Bella",
            "Un amor eterno",
            "Contigo todo es mágico"
        ];

        // function crearFrase() {
        //     const contenedor = document.getElementById('contenedor-frases');
        //     const span = document.createElement('span');

        //     // Elegir frase aleatoria
        //     span.innerText = frases[Math.floor(Math.random() * frases.length)];
        //     span.classList.add('frase-cayendo');

        //     // Posición horizontal aleatoria (0 a 90%)
        //     span.style.left = Math.random() * 90 + '%';

        //     // Duración de caída aleatoria (entre 5 y 10 segundos)
        //     const duracion = Math.random() * 5 + 5;
        //     span.style.animationDuration = duracion + 's';

        //     // Tamaño de letra aleatorio para dar profundidad
        //     span.style.fontSize = Math.random() * (18 - 12) + 12 + 'px';

        //     contenedor.appendChild(span);

        //     // Borrar el elemento cuando termine la animación para no saturar el celular
        //     setTimeout(() => {
        //         span.remove();
        //     }, duracion * 1000);
        // }

        // // Crear una frase nueva cada 2 segundos
        // setInterval(crearFrase, 2000);


        const contenedor = document.getElementById('contenedor-frases');
        // const musica = document.getElementById('musica-fondo');

        // --- CÓDIGO DE LAS FRASES ---
        function crearFrase() {
            const span = document.createElement('span');
            span.innerText = frases[Math.floor(Math.random() * frases.length)];
            span.classList.add('frase-cayendo');

            // Posición aleatoria
            span.style.left = Math.random() * 95 + '%';

            // Velocidad de caída (más rápida para que se vea dinámico)
            const duracion = Math.random() * 3 + 4;
            span.style.animationDuration = duracion + 's';

            contenedor.appendChild(span);

            setTimeout(() => { span.remove(); }, duracion * 1000);
        }

        // Frecuencia: Una frase cada 800 milisegundos (antes eran 2000)
        setInterval(crearFrase, 800);

        // --- CÓDIGO PARA CORTAR EL AUDIO ---
        // Ejemplo: Cortar a los 30 segundos exactos
        musica.ontimeupdate = function () {
            if (musica.currentTime >= 20) { // Cambia 30 por el segundo que quieras
                musica.pause();
                boton.style.display = 'block';
                musica.currentTime = 0; // Opcional: reinicia al principio
            }
        };

        // O si quieres cortarlo cuando se presione el botón "Continuar":
        document.getElementById('btn-continuar').addEventListener('click', () => {
            musica.pause();
        });

    </script>

</body>

</html>
